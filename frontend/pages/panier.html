<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier - RenovSouk</title>
    <meta name="description" content="Votre panier d'achat - RenovSouk">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        .cart-item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .quantity-input {
            max-width: 80px;
        }
        .cart-summary {
            background-color: #f8f9fa;
            border-radius: 8px;
            position: sticky;
            top: 20px;
        }
        .empty-cart {
            min-height: 400px;
        }
        .cart-item-row {
            border-bottom: 1px solid #dee2e6;
            padding: 1rem 0;
        }
        .cart-item-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="bg-light">
        <div class="container">
            <ol class="breadcrumb py-3 mb-0">
                <li class="breadcrumb-item"><a href="../index.html">Accueil</a></li>
                <li class="breadcrumb-item active">Mon Panier</li>
            </ol>
        </div>
    </nav>

    <!-- Cart Content -->
    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <h1 class="h2 fw-bold mb-4">
                    <i class="fas fa-shopping-cart me-2"></i>Mon Panier
                </h1>
            </div>
        </div>

        <div id="cart-container">
            <!-- Loading State -->
            <div class="row">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Chargement du panier...</span>
                    </div>
                    <p class="mt-3 text-muted">Chargement de votre panier...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Components JS -->
    <script src="../js/components.js"></script>
    <!-- Cart JS -->
    <script src="../js/panier.js"></script>
    <!-- Custom JS -->
    <script src="../js/script.js"></script>
</body>
</html>
