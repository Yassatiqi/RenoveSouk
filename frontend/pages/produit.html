<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail Produit - RenovSouk</title>
    <meta name="description" content="Détail du produit - RenovSouk">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        .product-image-main {
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product-gallery-thumb {
            height: 80px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .product-gallery-thumb:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .product-gallery-thumb.active {
            border: 3px solid #0d6efd;
        }
        .quantity-selector {
            max-width: 120px;
        }
        .product-specs table {
            font-size: 0.9rem;
        }
        .product-specs th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="bg-light">
        <div class="container">
            <ol class="breadcrumb py-3 mb-0" id="breadcrumb">
                <li class="breadcrumb-item"><a href="../index.html">Accueil</a></li>
                <li class="breadcrumb-item"><a href="boutique.html">Boutique</a></li>
                <li class="breadcrumb-item active" id="breadcrumb-product">Chargement...</li>
            </ol>
        </div>
    </nav>

    <!-- Product Detail -->
    <div class="container py-4">
        <div id="product-detail-container">
            <!-- Loading State -->
            <div class="row">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Chargement du produit...</span>
                    </div>
                    <p class="mt-3 text-muted">Chargement du produit...</p>
                </div>
            </div>
        </div>

        <!-- Related Products -->
        <section class="related-products mt-5" id="related-products-section" style="display: none;">
            <h3 class="fw-bold mb-4">Produits similaires</h3>
            <div class="row g-4" id="related-products-container">
                <!-- Les produits similaires seront chargés ici -->
            </div>
        </section>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Components JS -->
    <script src="../js/components.js"></script>
    <!-- Product Detail JS -->
    <script src="../js/produit.js"></script>
    <!-- Custom JS -->
    <script src="../js/script.js"></script>
</body>
</html>
