<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - RenovSouk</title>
    <meta name="description" content="Boutique RenovSouk - Découvrez notre large gamme de produits pour la rénovation au Maroc">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Header Placeholder -->
    <header-component></header-component>

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="bg-light">
        <div class="container">
            <ol class="breadcrumb py-3 mb-0">
                <li class="breadcrumb-item"><a href="../index.html">Accueil</a></li>
                <li class="breadcrumb-item active">Boutique</li>
            </ol>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-4">
        <div class="row">
            <!-- Sidebar Filters -->
            <div class="col-lg-3">
                <div class="filters-sidebar">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">Filtres</h5>
                        <button class="btn btn-sm btn-outline-secondary" id="clear-filters">
                            <i class="fas fa-times me-1"></i>Effacer
                        </button>
                    </div>
                    
                    <!-- Categories Filter -->
                    <div class="filter-section mb-4">
                        <h6 class="fw-bold">Catégories</h6>
                        <div id="categories-filter">
                            <!-- Les catégories seront chargées dynamiquement -->
                            <div class="text-center py-2">
                                <div class="spinner-border spinner-border-sm text-primary"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Price Filter -->
                    <div class="filter-section mb-4">
                        <h6 class="fw-bold">Prix (MAD)</h6>
                        <div class="mb-3">
                            <label for="min-price" class="form-label">Prix minimum</label>
                            <input type="number" class="form-control" id="min-price" placeholder="0">
                        </div>
                        <div class="mb-3">
                            <label for="max-price" class="form-label">Prix maximum</label>
                            <input type="number" class="form-control" id="max-price" placeholder="10000">
                        </div>
                        <button class="btn btn-sm btn-primary" id="apply-price-filter">Appliquer</button>
                    </div>

                    <!-- Stock Filter -->
                    <div class="filter-section mb-4">
                        <h6 class="fw-bold">Disponibilité</h6>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="in-stock" checked>
                            <label class="form-check-label" for="in-stock">En stock uniquement</label>
                        </div>
                    </div>

                    <!-- Special Offers -->
                    <div class="filter-section mb-4">
                        <h6 class="fw-bold">Offres spéciales</h6>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="on-sale">
                            <label class="form-check-label" for="on-sale">En promotion</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="new-products">
                            <label class="form-check-label" for="new-products">Nouveautés</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="featured">
                            <label class="form-check-label" for="featured">En vedette</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="col-lg-9">
                <!-- Toolbar -->
                <div class="products-toolbar d-flex justify-content-between align-items-center mb-4 p-3 bg-light rounded">
                    <div class="results-info">
                        <span id="results-count">Chargement...</span>
                    </div>
                    <div class="d-flex align-items-center">
                        <label for="sort-select" class="form-label me-2 mb-0">Trier par:</label>
                        <select class="form-select" id="sort-select" style="width: auto;">
                            <option value="name_asc">Nom (A-Z)</option>
                            <option value="name_desc">Nom (Z-A)</option>
                            <option value="price_asc">Prix croissant</option>
                            <option value="price_desc">Prix décroissant</option>
                            <option value="newest">Plus récents</option>
                            <option value="featured">En vedette</option>
                        </select>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="row g-4" id="products-grid">
                    <!-- Loading State -->
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Chargement des produits...</span>
                        </div>
                        <p class="mt-3 text-muted">Chargement des produits...</p>
                    </div>
                </div>

                <!-- Pagination -->
                <nav aria-label="Navigation des pages" class="mt-5">
                    <ul class="pagination justify-content-center" id="pagination">
                        <!-- La pagination sera générée dynamiquement -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Footer Placeholder -->
    <footer-component></footer-component>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Components JS -->
    <script src="../components/widgets/footer.js"></script>
    <script src="../components/widgets/header.js"></script>
    <!-- Boutique JS -->
    <script src="../js/boutique.js"></script>
    <!-- Custom JS -->
</body>
</html>
