<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finaliser ma commande - RenovSouk</title>
    <meta name="description" content="Finaliser votre commande - RenovSouk">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        .checkout-steps {
            background: linear-gradient(90deg, #0d6efd 50%, #dee2e6 50%);
            height: 4px;
            border-radius: 2px;
        }
        .step-indicator {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin: 0 auto;
        }
        .step-active .step-indicator {
            background-color: #0d6efd;
            color: white;
        }
        .step-completed .step-indicator {
            background-color: #198754;
            color: white;
        }
        .step-pending .step-indicator {
            background-color: #dee2e6;
            color: #6c757d;
        }
        .order-summary {
            background-color: #f8f9fa;
            border-radius: 8px;
            position: sticky;
            top: 20px;
        }
        .payment-method {
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .payment-method:hover {
            border-color: #0d6efd;
        }
        .payment-method.selected {
            border-color: #0d6efd;
            background-color: #f0f8ff;
        }
        .bank-details {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="bg-light">
        <div class="container">
            <ol class="breadcrumb py-3 mb-0">
                <li class="breadcrumb-item"><a href="../index.html">Accueil</a></li>
                <li class="breadcrumb-item"><a href="panier.html">Panier</a></li>
                <li class="breadcrumb-item active">Commande</li>
            </ol>
        </div>
    </nav>

    <!-- Checkout Content -->
    <div class="container py-4">
        <!-- Progress Steps -->
        <div class="row mb-5">
            <div class="col-12">
                <div class="checkout-steps mb-3"></div>
                <div class="row text-center">
                    <div class="col-4">
                        <div class="step-completed">
                            <div class="step-indicator">
                                <i class="fas fa-check"></i>
                            </div>
                            <small class="d-block mt-2">Panier</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="step-active">
                            <div class="step-indicator">2</div>
                            <small class="d-block mt-2">Informations</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="step-pending">
                            <div class="step-indicator">3</div>
                            <small class="d-block mt-2">Confirmation</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="checkout-container">
            <!-- Loading State -->
            <div class="row">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Chargement...</span>
                    </div>
                    <p class="mt-3 text-muted">Préparation de votre commande...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Components JS -->
    <script src="../js/components.js"></script>
    <!-- Checkout JS -->
    <script src="../js/checkout.js"></script>
    <!-- Custom JS -->
    <script src="../js/script.js"></script>
</body>
</html>
